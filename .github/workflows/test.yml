name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          AUTH_SECRET: e2e-auth-secret-value
      - run: npm run test:e2e
        env:
          CI: "true"
